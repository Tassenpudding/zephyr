# The FT5336 touch INT is wired to PIO4_0 (GPIO port 4). The LPC546xx PINT can
# only take pin interrupts from GPIO ports 0-1, so this pin cannot be used as a
# GPIO interrupt source. Run the touch controller in polling mode instead.
CONFIG_INPUT_FT5336_INTERRUPT=n
