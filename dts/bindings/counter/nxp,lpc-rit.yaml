description: |
  NXP LPC Repetitive Interrupt Timer.

  The timer has a single 48 bit compare register, which the driver uses as the
  counter top value, so the device exposes no alarm channels.

compatible: "nxp,lpc-rit"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true
