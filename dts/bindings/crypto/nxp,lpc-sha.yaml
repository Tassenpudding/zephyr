description: |
  NXP LPC SHA engine.

  The block computes SHA-1 and SHA-256. Only SHA-256 is reachable through the
  Zephyr crypto API, which has no SHA-1 algorithm.

compatible: "nxp,lpc-sha"

include: base.yaml

properties:
  reg:
    required: true
