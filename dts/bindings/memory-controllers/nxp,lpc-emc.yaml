description: |
  NXP LPC External Memory Controller (EMC).

  The EMC drives external static and dynamic (SDRAM) memories. Each attached
  dynamic memory chip is described by a "nxp,lpc-emc-sdram" child node whose
  unit address is the EMC dynamic chip-select index (0 -> DYCS0 at 0xA0000000,
  1 -> DYCS1, ...). The SDRAM address window itself is declared separately as a
  "zephyr,memory-region" node so the linker can place data in it.

compatible: "nxp,lpc-emc"

include: [base.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  "#address-cells":
    required: true
    const: 1

  "#size-cells":
    required: true
    const: 0

  nxp,emc-clock-div:
    type: int
    default: 1
    description: |
      EMC clock divider. The EMC input clock is AHB_CLK / (nxp,emc-clock-div + 1).
      The reset default of 1 (divide by two) is used by the reference design so
      the EMC runs at half the core clock, which keeps the feedback clock stable
      without programming the delay line.

  nxp,emc-big-endian:
    type: boolean
    description: |
      Configure the EMC data bus in big-endian mode. Omit for the default
      little-endian mode.

  nxp,emc-external-feedback-clock:
    type: boolean
    description: |
      Use the external EMC_FBCLK input as the read feedback clock instead of the
      internal loopback of the EMC_CLK output. Omit for internal loopback, which
      is correct for the common case where EMC_FBCLK is not routed on the board.

  nxp,emc-feedback-clock-delay:
    type: int
    default: 0
    description: |
      Feedback-clock delay (SYSCON EMCDLYCTRL FBCLK_DELAY field, 0-31) used to
      align read-data capture with the SDRAM round-trip delay at the configured
      EMC clock. The reset default is generally too small once the EMC runs
      above ~50 MHz, causing corrupted multi-beat (32-bit) reads; the correct
      value is board/frequency specific and best found with a memory test.
      A value of 0 leaves the register at its reset default.
