description: |
  NXP LPC on-chip EEPROM.

  The controller registers and the storage array live in separate regions, so
  the node needs both:

      eeprom0: eeprom@40014000 {
              compatible = "nxp,lpc-eeprom";
              reg = <0x40014000 0x1000>, <0x40108000 DT_SIZE_K(16)>;
              reg-names = "control", "memory";
              interrupts = <52 0>;
              clocks = <&syscon MCUX_BUS_CLK>;
              size = <DT_SIZE_K(16)>;
      };

compatible: "nxp,lpc-eeprom"

include: eeprom-base.yaml

properties:
  reg:
    required: true

  reg-names:
    required: true

  clocks:
    required: true

  size:
    required: true
